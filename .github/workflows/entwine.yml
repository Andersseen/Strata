# Entwine is the maintainer's internal documentation tool: this validates links, anchors and
# repository references, and publishes nothing. Readers get Doqs in the official website, and
# `deploy-docs-redirect` in ci.yml sends the old GitHub Pages address there. Build it locally with
# `npx --yes @entwine/cli@0.5.1 build`. Do not regenerate this file with `entwine setup`: that would
# restore a public Pages deployment.
name: Entwine docs

on:
  pull_request:
    paths:
      - "docs/**"
      # Repository references may change anywhere in the work tree.
      - "**"
      - ".github/workflows/entwine.yml"
  push:
    paths:
      - "docs/**"
      # Repository references may change anywhere in the work tree.
      - "**"
      - ".github/workflows/entwine.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ENTWINE_VERSION: "0.5.1"

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Entwine
        run: npm install --global "@entwine/cli@${ENTWINE_VERSION}"
      - name: Validate documentation
        run: entwine check
