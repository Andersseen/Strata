# entwine-managed: generated by `entwine setup`. Safe to edit.
# Delete this file and re-run `entwine setup` to regenerate it.
name: Entwine docs

on:
  pull_request:
    paths:
      - "docs/**"
      # Repository references may change anywhere in the work tree.
      - "**"
      - ".github/workflows/entwine.yml"
  push:
    paths:
      - "docs/**"
      # Repository references may change anywhere in the work tree.
      - "**"
      - ".github/workflows/entwine.yml"
  workflow_dispatch:

# Least privilege: the deploy job alone receives Pages and OIDC permissions.
permissions:
  contents: read

env:
  ENTWINE_VERSION: "0.5.1"

jobs:
  build:
    # Pull requests are validated; only the default branch is built for publishing.
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Entwine
        run: npm install --global "@entwine/cli@${ENTWINE_VERSION}"
      - name: Validate documentation
        run: entwine check
      - name: Build static site
        if: github.event_name != 'pull_request'
        run: entwine build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
