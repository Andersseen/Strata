name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build before type-aware lint/typecheck: lint uses typescript-eslint's
      # projectService, which resolves `@strata/core`/`@strata/h3` through
      # their package.json `exports` (pointing at `dist`). On a clean
      # checkout those declarations don't exist until packages are built, so
      # lint must run after build, not before (see docs/STATE.md).
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Chromium for website e2e
        run: pnpm --filter @strata/www exec playwright install --with-deps chromium

      - name: Test official website end-to-end
        run: pnpm --filter @strata/www test:e2e

      - name: Consumer type-closure experiment (SPEC-002)
        run: pnpm test:consumer:types

  deploy-www:
    name: Deploy official website to Cloudflare Pages
    needs: ci
    # A production Pages deployment is only made after a PR has been merged
    # (which produces a push to main). Pull requests only run validation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: website-production
      url: https://strata-www.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Pages artifact
        run: pnpm www:build:cloudflare

      # Wrangler is pinned in @strata/www. Calling that workspace binary avoids
      # wrangler-action trying to mutate the pnpm workspace root at runtime.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm --filter @strata/www exec wrangler pages deploy dist/analog/public
          --project-name=strata-www --branch=main
