name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build before type-aware lint/typecheck: lint uses typescript-eslint's
      # projectService, which resolves `@strata/core`/`@strata/h3` through
      # their package.json `exports` (pointing at `dist`). On a clean
      # checkout those declarations don't exist until packages are built, so
      # lint must run after build, not before (see docs/STATE.md).
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Consumer type-closure experiment (SPEC-002)
        run: pnpm test:consumer:types

      - name: Consumer qualification
        run: pnpm test:consumer
