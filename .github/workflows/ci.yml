name: CI

# One pipeline: eleven parallel jobs plus the aggregate `Verify` gate. Jobs share nothing: each checks
# out the same SHA and builds what it needs from source, so wall time is the slowest job instead of the
# sum of all steps. The job grouping comes from measured hosted step timings
# (docs/research/ci-acceleration.md): no single job carries more than ~6 minutes of test commands.
#
# Every mandatory command is listed in tools/ci/required-commands.json. `pnpm test:ci` (run by the
# `static` job through `pnpm test`) fails when a listed command is missing, duplicated, made
# conditional, allowed to fail, or placed in a job that `Verify` does not depend on.
#
# The slow, external-dependent or informational suites live in extended.yml (weekly cron + manual).
on:
  push:
    branches: [main]
  pull_request:

# Pull requests: a newer push to the same PR cancels the superseded run (no runner time on obsolete
# commits). Pushes to main: one group per SHA and never cancelled, so every main commit gets its own
# complete `Verify` (the Release workflow authorizes only the exact SHA of a successful Verify; a
# cancelled main run used to leave its commit with no Verify at all, run 42041343959).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fast gate: workflow validation, build, type-aware lint, typecheck, unit tests (includes the
  # release, performance-tool and CI-coverage self-tests).
  static:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every workflow file, before anything is installed: an invalid expression context (for example
      # `runner.*` in job-level `env`) makes GitHub reject a file with zero jobs, which a green PR never
      # shows. Pinned release binary, checksum verified; shellcheck and pyflakes are disabled so this
      # gate stays a deterministic syntax/context check.
      - name: Validate workflow files (actionlint)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

      - uses: ./.github/actions/setup

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Production build, SSR, hydration, document navigation, @defer and the build-graph firewall of the
  # Server Component fixture.
  graph-ssr:
    name: Server Component graph (build, SSR, hydration, navigation, firewall)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRATA_KEEP_CONSUMER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `runner.*` is not available in job-level `env`, so the diagnostics directory is set here.
      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          build: packages
          playwright: "true"

      - name: Server-component graph PoC (production build, SSR, hydration)
        run: pnpm test:server-components

      - name: Server-component navigation PoC (document vs router navigation)
        run: pnpm test:server-component-navigation

      # Angular-owned @defer inside client islands; @defer in a server-owned template fails the build.
      - name: Server Components + Angular @defer (incremental hydration, lazy chunks)
        run: pnpm test:server-component-defer

      # `import "@strata-sc/server-components/server-only"`: illegal browser imports fail real builds.
      - name: Server-only modules (build-graph firewall)
        run: pnpm test:server-component-server-only

      # Failure-only: keep the server logs and the built server output so an intermittent SSR failure
      # (HTTP 200 with an empty page) can be diagnosed. Never runs on success and changes no result.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-diagnostics-graph-ssr
          path: |
            ${{ runner.temp }}/strata-diagnostics
            apps/analog-fixture/dist
            /tmp/strata-*-consumer-*/consumer/dist
          if-no-files-found: ignore
          retention-days: 7

  # The dependency optimizer over installed packages and the real Analog/Vite dev server.
  graph-dev:
    name: Server Component graph (dependency optimizer, dev server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRATA_KEEP_CONSUMER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          build: packages
          playwright: "true"

      # Packed, externally installed npm packages through Vite's dependency optimizer and production
      # builds: server-only package modules, barrels and dynamic imports are refused with the Strata
      # diagnostic and never served; private markers are scanned in assets and source maps.
      - name: Server-only modules vs the dependency optimizer (installed packages)
        run: pnpm test:server-component-optimized-deps

      # The REAL Analog/Vite dev server in Chromium: server-owned edits regenerate the graph and reload
      # the document once, client-owned edits do not, a module that starts asserting server-only is
      # refused live. Restores every edited file.
      - name: Server Component dev server (graph regeneration, reload semantics, live firewall)
        run: pnpm test:server-component-dev

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-diagnostics-graph-dev
          path: |
            ${{ runner.temp }}/strata-diagnostics
            apps/analog-fixture/dist
            /tmp/strata-*-consumer-*/consumer/dist
          if-no-files-found: ignore
          retention-days: 7

  # Buffered SSR failure/recovery and request-context isolation on Node and local workerd.
  runtime-failures:
    name: Server Component runtime (failure recovery, request context; Node + workerd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRATA_KEEP_CONSUMER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          build: packages
          playwright: "true"

      # Failure contract for buffered SSR + document navigation, sibling-host isolation, Back/re-entry.
      - name: Server Component failure and recovery (Node + workerd)
        run: pnpm test:server-component-failures

      # Angular's public REQUEST_CONTEXT token, per-render Analog providers, deterministic 24-request overlap.
      - name: Server Component request context (Node + workerd)
        run: pnpm test:server-component-request-context

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-diagnostics-runtime-failures
          path: |
            ${{ runner.temp }}/strata-diagnostics
            apps/analog-fixture/dist
            /tmp/strata-*-consumer-*/consumer/dist
          if-no-files-found: ignore
          retention-days: 7

  # Confidentiality, SSR response status and authorization on Node and local workerd, plus the internal
  # Analog fixture contracts.
  runtime-security:
    name: Server Component runtime (confidentiality, SSR response, authorization; Node + workerd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRATA_KEEP_CONSUMER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          build: packages
          playwright: "true"

      # Server-owned DATA stays off every public surface, scanned with synthetic canaries and a PUBLIC
      # positive control. No external secrets.
      - name: Server Component data confidentiality (synthetic canaries, Node + workerd)
        run: pnpm test:server-component-security

      # Consumer-owned expected-service recovery can set a response status through Analog's public
      # per-request response token. Unexpected render failures stay a separate HTTP-200 limitation control.
      - name: Server Component SSR response and recovery (Node + workerd)
        run: pnpm test:server-component-ssr-response

      # Fixture-only synthetic principal resolution and resource authorization (HttpOnly cookie).
      - name: Server Component authorization isolation (Node + workerd)
        run: pnpm test:server-component-authorization

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-diagnostics-runtime-security
          path: |
            ${{ runner.temp }}/strata-diagnostics
            apps/analog-fixture/dist
            /tmp/strata-*-consumer-*/consumer/dist
          if-no-files-found: ignore
          retention-days: 7

  # The internal Analog fixture (no browser): HTTP contract, DI composition, streaming, observability,
  # correlation, header and form validation on Node, the Vite dev server and local workerd.
  runtime-analog:
    name: Analog runtime contracts (Node + dev + workerd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # tools/analog/* drive HTTP only; no suite here launches Chromium.
      - uses: ./.github/actions/setup
        with:
          build: packages

      # The internal Analog fixture in dev and production: controller/HTTP contract, guards, interceptors,
      # Standard Schema validation, response helpers, the SPEC-003 Angular DI composition matrix and the
      # client-bundle scan.
      - name: Analog fixture contracts (dev + production)
        run: pnpm test:analog

      # `streamResponse()` request-scoped resource lifetime, a real Analog serverFn beside Strata, native
      # routes, the API boundary and SSR, on the Node production server, the Vite dev server and local workerd.
      - name: Analog streaming lifecycle and serverFn coexistence (Node + dev + workerd)
        run: pnpm test:analog-streaming

      # `onRequestSettled`: one safe observation per Strata invocation, after cleanup, with the
      # client-visible response unchanged, on Node, the Vite dev server and local workerd.
      - name: Analog request observability (Node + dev + workerd)
        run: pnpm test:analog-observability

      # `requestCorrelation`: one id shared by guard, interceptor, factory, handler and observer, with
      # 24 overlapping requests isolated and nothing added to a response, on Node, dev and local workerd.
      - name: Analog request correlation (Node + dev + workerd)
        run: pnpm test:analog-correlation

      # `validateHeaders`: safe 400 with source "headers", cleanup-first, observed as input-rejected,
      # isolated under overlap, on Node, the Vite dev server and local workerd.
      - name: Analog header validation (Node + dev + workerd)
        run: pnpm test:analog-headers

      # Opt-in URL-encoded form validation, bounded byte reads, cleanup and observation on each runtime.
      - name: Analog validated forms (Node + dev + workerd)
        run: pnpm test:analog-forms

  # The PACKED Server Components package installed with npm into an app outside the workspace, and the
  # TypeScript 5.9 packed-package consumer. Never publishes.
  consumers-package:
    name: Packed consumer (Server Components package, TypeScript 6.0 + 5.9)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRATA_KEEP_CONSUMER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          build: packages
          playwright: "true"

      # Tarball and declarations (TypeScript 6 and 5.9), Node build/SSR/hydration, server-only firewall,
      # `vite` dev with one server-owned edit, Cloudflare build on local workerd.
      - name: Server Component packed-package consumer (outside the workspace)
        run: pnpm test:server-component-package-consumer

      - name: Packed-package consumer (TypeScript 5.9.2)
        run: pnpm test:package-consumer

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-diagnostics-consumers-package
          path: |
            ${{ runner.temp }}/strata-diagnostics
            /tmp/strata-*-consumer-*/consumer/dist
          if-no-files-found: ignore
          retention-days: 7

  # An INSTALLED Angular library (npm tarball, two versions) as Strata client islands, and the
  # consumer-owned Angular DI composition over the packed tarballs.
  consumers-islands:
    name: Packed consumer (installed Angular library islands, Angular DI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRATA_KEEP_CONSUMER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          build: packages
          playwright: "true"

      # Build-time and browser-time reference matrices on Nitro Node and local workerd, package upgrade
      # and cache behaviour.
      - name: Server Component installed-island qualification
        run: pnpm test:server-component-installed-island

      # Consumer-owned Angular DI over the packed tarballs, isolated to Nitro Node (includes the
      # keep-alive-after-413 connection check).
      - name: Packed Angular DI consumer (Node only)
        run: pnpm test:analog-packed-di-consumer

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-diagnostics-consumers-islands
          path: |
            ${{ runner.temp }}/strata-diagnostics
            /tmp/strata-*-consumer-*/consumer/dist
          if-no-files-found: ignore
          retention-days: 7

  # All three packed packages in ONE installed Analog app, its source-mutation smoke and the
  # multi-isolate authorization-observation reproduction.
  consumers-full-stack:
    name: Packed consumer (full stack, adversarial smoke, multi-isolate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRATA_KEEP_CONSUMER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          build: packages
          playwright: "true"

      # A Strata controller behind a public HTTP API called by a hydrated [strataClient] island next to
      # a server-only @ServerComponent().
      - name: Full-stack packed-package consumer (core + analog + server-components)
        run: pnpm test:full-stack-package-consumer

      # Real source mutation through the independently packed production consumer; smoke one fault per PR.
      - name: Full-stack adversarial source-mutation smoke
        run: pnpm test:full-stack-adversarial-security:smoke

      # F6: independent Node and workerd instances behind a round-robin router. The pre-fix
      # cross-request read-back must fail; the invocation-owned read receipts must pass. Reuses the
      # verified packed install of the full-stack step above (STRATA_ADVERSARIAL_REUSE_ROOT).
      - name: Full-stack multi-isolate authorization observation (Node + Node + workerd)
        run: pnpm test:full-stack-multi-isolate

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-diagnostics-consumers-full-stack
          path: |
            ${{ runner.temp }}/strata-diagnostics
            /tmp/strata-adversarial-security-*
            /tmp/strata-*-consumer-*/consumer/dist
          if-no-files-found: ignore
          retention-days: 7

  # Deployment version skew and the Cloudflare Pages builds on local workerd. PR-safe: no account, no
  # secrets, no deployment (the manual full-stack-deployed-cloudflare.yml deploys).
  consumers-edge:
    name: Packed consumer (deployment skew, Cloudflare local workerd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRATA_KEEP_CONSUMER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          build: packages
          playwright: "true"

      # Two independently built releases of the packed consumer (identity A, identity B, and one without),
      # a document of one served with the script of another, on Nitro Node and LOCAL workerd (not a deployed
      # Pages project): build-mismatch classification, bounded opt-in reload, rollback, confidentiality.
      - name: Server Component deployment skew (two-build matrix, Node + local workerd)
        run: pnpm test:server-component-deployment-skew

      # The full-stack packed packages built for Cloudflare Pages and verified black-box on local workerd.
      - name: Full-stack Cloudflare build + local workerd rehearsal (no deployment)
        run: pnpm test:full-stack-deployed-cloudflare

      # Local workerd via the Wrangler pinned in @strata-sc/www: no account, no secrets.
      - name: Server-component PoC on Cloudflare Pages (local Wrangler runtime)
        run: pnpm test:server-components:cloudflare

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-diagnostics-consumers-edge
          path: |
            ${{ runner.temp }}/strata-diagnostics
            apps/analog-fixture/dist
            /tmp/strata-*-consumer-*/consumer/dist
          if-no-files-found: ignore
          retention-days: 7

  # The official site and Relay dogfood the private package: graph split, SSR and their Playwright suites.
  apps:
    name: Website and Relay (dogfood, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Test official website end-to-end
        run: pnpm --filter @strata-sc/www test:e2e

      - name: Website Server Component dogfood (Node + Cloudflare builds)
        run: pnpm test:www:server-components

      - name: Relay Server Component dogfood (graph, SSR, shared state, Playwright)
        run: pnpm test:relay:server-components

  # Single required check. Branch protection, `deploy-www` and the Release authorizer
  # (tools/release/lib/verify-run.ts) depend on this one name, whatever the number of parallel jobs.
  # `if: always()` makes it run (and fail) when a needed job failed, was cancelled or was skipped:
  # only an explicit `success` from every needed job, and exactly the expected number of them, passes.
  ci:
    name: Verify
    if: always()
    needs:
      - static
      - graph-ssr
      - graph-dev
      - runtime-failures
      - runtime-security
      - runtime-analog
      - consumers-package
      - consumers-islands
      - consumers-full-stack
      - consumers-edge
      - apps
    runs-on: ubuntu-latest
    steps:
      - name: Every parallel job succeeded
        env:
          EXPECTED_JOBS: "11"
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          count=0
          for result in $RESULTS; do
            count=$((count + 1))
            if [ "$result" != "success" ]; then
              echo "::error::at least one parallel job did not succeed ($result)"
              exit 1
            fi
          done
          if [ "$count" -ne "$EXPECTED_JOBS" ]; then
            echo "::error::expected $EXPECTED_JOBS job results, got $count"
            exit 1
          fi

  deploy-www:
    name: Deploy official website to Cloudflare Pages
    needs: ci
    # A production Pages deployment is only made after a PR has been merged
    # (which produces a push to main). Pull requests only run validation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Main CI runs are no longer cancelled, so two merges can reach this job together. Serialize the
    # production deployment and never cancel one that has started (a half-finished upload); GitHub
    # keeps only the newest pending run, so the newest main commit is deployed last.
    concurrency:
      group: deploy-www-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    environment:
      name: website-production
      url: https://strata-www.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Pages artifact
        run: pnpm www:build:cloudflare

      # Wrangler is pinned in @strata-sc/www. Calling that workspace binary avoids
      # wrangler-action trying to mutate the pnpm workspace root at runtime.
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output="$(pnpm --filter @strata-sc/www exec wrangler pages project create strata-www \
            --production-branch main \
            --compatibility-date 2026-09-21 \
            --compatibility-flag nodejs_compat 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"
          if [[ $status -ne 0 && "$output" != *"A project with this name already exists"* ]]; then
            exit "$status"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm --filter @strata-sc/www exec wrangler pages deploy dist/analog/public
          --project-name=strata-www --branch=main
