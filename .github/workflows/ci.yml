name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build before type-aware lint/typecheck: lint uses typescript-eslint's
      # projectService, which resolves `@strata-sc/core`/`@strata-sc/h3` through
      # their package.json `exports` (pointing at `dist`). On a clean
      # checkout those declarations don't exist until packages are built, so
      # lint must run after build, not before (see docs/STATE.md).
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Chromium for website e2e
        run: pnpm --filter @strata-sc/www exec playwright install --with-deps chromium

      - name: Test official website end-to-end
        run: pnpm --filter @strata-sc/www test:e2e

      # Reuses the Chromium installed above (same Playwright 1.62.1).
      - name: Server-component graph PoC (production build, SSR, hydration)
        run: pnpm test:server-components

      - name: Server-component navigation PoC (document vs router navigation)
        run: pnpm test:server-component-navigation

      # Angular-owned @defer inside client islands; @defer in a server-owned
      # template fails the build.
      - name: Server Components + Angular @defer (incremental hydration, lazy chunks)
        run: pnpm test:server-component-defer

      # `import "@strata-sc/server-components/server-only"`: illegal browser
      # imports (direct, dynamic, barrel, ?raw, @defer-lazy) fail real builds.
      - name: Server-only modules (build-graph firewall)
        run: pnpm test:server-component-server-only

      # Server-owned DATA stays off every public surface (HTML, boundary props,
      # hydrated DOM, network, browser output, source maps, errors, build
      # diagnostics) on Node and local workerd, scanned with synthetic canaries
      # and a PUBLIC positive control. No external secrets.
      - name: Server Component data confidentiality (synthetic canaries, Node + workerd)
        run: pnpm test:server-component-security

      # Failure contract for buffered SSR + document navigation: render and
      # serialization failures, preflight/commit failures, sibling-host
      # isolation, navigation/Back/re-entry, on Node and local workerd.
      - name: Server Component failure and recovery (Node + workerd)
        run: pnpm test:server-component-failures

      # The REAL Analog/Vite dev server in Chromium: server-owned edits regenerate
      # the graph and reload the document once, client-owned edits do not, a module
      # that starts asserting server-only is refused live, and an invalid edit
      # fails the client graph closed until fixed. Restores every edited file.
      - name: Server Component dev server (graph regeneration, reload semantics, live firewall)
        run: pnpm test:server-component-dev

      # Local workerd via the Wrangler pinned in @strata-sc/www: no account, no secrets.
      - name: Server-component PoC on Cloudflare Pages (local Wrangler runtime)
        run: pnpm test:server-components:cloudflare

      # The official site dogfoods the private package on its homepage: graph
      # split, SSR and its Playwright suite on Nitro and on local workerd.
      - name: Website Server Component dogfood (Node + Cloudflare builds)
        run: pnpm test:www:server-components

      # Relay uses the package like a real app: several islands, islands inside
      # @for, and a Server Component reading the controllers' own store.
      - name: Relay Server Component dogfood (graph, SSR, shared state, Playwright)
        run: pnpm test:relay:server-components

      - name: Consumer type-closure experiment (SPEC-002)
        run: pnpm test:consumer:types

      - name: Packed-package consumer (TypeScript 5.9.2)
        run: pnpm test:package-consumer

  deploy-www:
    name: Deploy official website to Cloudflare Pages
    needs: ci
    # A production Pages deployment is only made after a PR has been merged
    # (which produces a push to main). Pull requests only run validation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: website-production
      url: https://strata-www.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Pages artifact
        run: pnpm www:build:cloudflare

      # Wrangler is pinned in @strata-sc/www. Calling that workspace binary avoids
      # wrangler-action trying to mutate the pnpm workspace root at runtime.
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output="$(pnpm --filter @strata-sc/www exec wrangler pages project create strata-www \
            --production-branch main \
            --compatibility-date 2026-09-21 \
            --compatibility-flag nodejs_compat 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"
          if [[ $status -ne 0 && "$output" != *"A project with this name already exists"* ]]; then
            exit "$status"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm --filter @strata-sc/www exec wrangler pages deploy dist/analog/public
          --project-name=strata-www --branch=main
