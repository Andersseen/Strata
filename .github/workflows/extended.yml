name: Extended checks

# The slow, noisy or externally-dependent suites that must not gate or slow every pull request:
#   performance  four-arm full-stack bundle/latency baseline (docs/research/full-stack-performance-baseline.md),
#                optionally also the three-island scaling profile on the SAME runner
#                (docs/research/full-stack-performance-scaling.md)
#   performance-scaling  the controller/provider scaling profile (three islands, eight controllers, mixed
#                failure burst, cleanup and keep-alive-after-413 checks; docs/research/m5-production-qualification.md)
#   registry     the PUBLISHED @strata-sc/server-components from npm, built for Cloudflare Pages, local workerd;
#                the published core + analog + server-components full-stack tuple (fresh install: ecosystem
#                drift) and the committed FROZEN candidate (npm ci of tests/full-stack-candidate: reproduction);
#                A/B upgrade and rollback with the local deployment rehearsal
#   types        the H3 consumer type-closure experiment (SPEC-002; its expected verdict is "upstream-blocked")
#   integrity    the packed Server Components consumer with many independent rebuilds, each followed by
#                cold-start overlapping first requests (docs/research/server-component-ssr-integrity-v07.md)
#   adversarial  three independently packed, installed, source-mutated full-stack consumers
#   rc0          the RC0 qualification (docs/research/rc0-production-qualification.md): the production
#                Nitro node-server process for the source-packed and the frozen published candidate
#                (hosted PRODUCTION-PROCESS evidence, not a deployment), the duplicated-install arms of
#                the /ssr contract, and the RC readiness report with its non-publishing rehearsal
#
# - Weekly (Monday 04:00 UTC) runs all suites; `workflow_dispatch` runs one or all with custom workload.
# - No deployment, no npm publication, no Cloudflare secrets, no write to any external service
#   (`permissions: contents: read`; no `secrets.*` is referenced).
# - The performance jobs assert correctness and two deterministic browser-size budgets (controllers add
#   0 B; Server Components overhead <= 5 KiB gzip; byte-identical across builds and platforms). There is
#   deliberately NO latency gate and no server-size gate: hosted runners are noisy and server size
#   depends on application shape. The JSON report is evidence.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        default: all
        options:
          [all, performance, performance-scaling, registry, types, integrity, adversarial, rc0]
      islands:
        description: "Performance: island profile. one (default, the PR #86 baseline), three, or both (same job and runner, then a comparison)"
        type: choice
        default: one
        options: [one, three, both]
      reps:
        description: "Performance: repetitions per arm and runtime (default 3)"
        type: string
        default: "3"
      build_reps:
        description: "Performance: fresh builds per arm and preset (default 3)"
        type: string
        default: "3"
      requests:
        description: "Performance: measured requests per target and mode (default 200)"
        type: string
        default: "200"
      warmup:
        description: "Performance: warm-up requests per target (default 50)"
        type: string
        default: "50"
      concurrency:
        description: "Performance: in-flight requests in the concurrent mode (default 8)"
        type: string
        default: "8"

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-production:
    name: Node production process (${{ matrix.candidate }} candidate, Nitro node-server, hosted Linux)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'rc0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        candidate: [source-packed, frozen]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          build: packages
          playwright: "true"

      - name: Evidence file
        run: echo "STRATA_NODE_PRODUCTION_OUT=$RUNNER_TEMP/node-production-${{ matrix.candidate }}.json" >> "$GITHUB_ENV"

      - name: Production entry under mixed concurrent load
        run: |
          if [ "${{ matrix.candidate }}" = "frozen" ]; then
            pnpm test:node-production:frozen
          else
            pnpm test:node-production
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-production-${{ matrix.candidate }}-evidence
          path: ${{ env.STRATA_NODE_PRODUCTION_OUT }}
          if-no-files-found: ignore
          retention-days: 30

  ssr-duplicate-install:
    name: SSR contract with a duplicated package installation (Node + local workerd)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'rc0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          build: packages

      - name: Duplicated installed-package consumers
        run: pnpm test:server-component-ssr-duplicate-install

  rc-readiness:
    name: RC readiness report and non-publishing prerelease rehearsal
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'rc0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: Changesets hangs deepening a shallow clone that has no remote.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The rehearsal packs and installs the versioned tuple.
      - uses: ./.github/actions/setup
        with:
          build: packages

      # NO-GO is a state, not an error: --report prints it and fails only on a broken rehearsal. This
      # job is the evidence of the rehearsal and of nothing else: a green run never authorizes a
      # release. Only `pnpm release:rc:check` does, and pipefail keeps the rehearsal's exit status.
      - name: RC readiness (report only, not an authorization)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          pnpm release:rc:rehearse | tee -a "$GITHUB_STEP_SUMMARY"

  adversarial:
    name: Full-stack source-mutated security qualification (Node + workerd + Chromium)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'adversarial'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STRATA_KEEP_CONSUMER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `runner.*` is not available in job-level `env`: using it there made GitHub reject the whole
      # file before any job started (every Extended run from PR #167 on failed with zero jobs).
      # `actionlint` in ci.yml now catches this class of error on every pull request.
      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-adversarial-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Mutated external production consumers
        run: pnpm test:full-stack-adversarial-security

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-adversarial-security-diagnostics
          path: |
            ${{ runner.temp }}/strata-adversarial-diagnostics
            /tmp/strata-adversarial-security-*
            /tmp/strata-full-stack-consumer-*/consumer/dist
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Full-stack performance baseline (Node + local workerd)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'performance'
    runs-on: ubuntu-latest
    # One profile fits comfortably; `both` runs the benchmark twice in this single job.
    timeout-minutes: 100
    env:
      STRATA_PERF_REPS: ${{ inputs.reps || '3' }}
      STRATA_PERF_BUILD_REPS: ${{ inputs.build_reps || '3' }}
      STRATA_PERF_REQUESTS: ${{ inputs.requests || '200' }}
      STRATA_PERF_WARMUP: ${{ inputs.warmup || '50' }}
      STRATA_PERF_CONCURRENCY: ${{ inputs.concurrency || '8' }}
      PROFILE: ${{ inputs.islands || 'one' }}
    steps:
      # Full history: the report records `git merge-base HEAD origin/main` as its starting SHA, which a
      # shallow clone cannot resolve.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          build: "false"
          playwright: "true"

      # `runner.*` is not available in job-level env, so the evidence directory is set here.
      - name: Evidence directory
        run: echo "EVIDENCE=$RUNNER_TEMP/full-stack-performance-evidence" >> "$GITHUB_ENV"

      # Quoted: unquoted, YAML reads ` #86 baseline)` as a comment and the step is named "Measure one
      # island (PR", which the RC gate (tools/release/lib/rc-catalog.ts) can never match.
      - name: "Measure one island (PR #86 baseline)"
        if: env.PROFILE == 'one' || env.PROFILE == 'both'
        run: pnpm test:full-stack-performance
        env:
          STRATA_PERF_ISLANDS: "1"
          STRATA_PERF_OUT: ${{ env.EVIDENCE }}/one-island

      - name: Measure three islands
        if: ${{ !cancelled() && (env.PROFILE == 'three' || env.PROFILE == 'both') }}
        run: pnpm test:full-stack-performance
        env:
          STRATA_PERF_ISLANDS: "3"
          STRATA_PERF_OUT: ${{ env.EVIDENCE }}/three-island

      # Refuses an incomparable pair (tuple, packages, compression, presets, arms, correctness).
      # It reports the candidate budgets; it never fails on a size or latency value.
      - name: Compare one and three islands
        if: ${{ !cancelled() && env.PROFILE == 'both' }}
        run: >
          pnpm test:full-stack-performance:compare
          "$EVIDENCE/one-island/report.json" "$EVIDENCE/three-island/report.json" "$EVIDENCE"

      - name: Summary and redacted environment
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$EVIDENCE"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "event=$GITHUB_EVENT_NAME"
            echo "profile=$PROFILE"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "cpus=$(nproc)"
            echo "cpu_model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo "memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
          } > "$EVIDENCE/environment.txt"
          for summary in "$EVIDENCE"/*/summary.md "$EVIDENCE"/comparison.md; do
            [ -f "$summary" ] && { echo "### $(basename "$(dirname "$summary")")/$(basename "$summary")"; cat "$summary"; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-performance-evidence
          path: ${{ env.EVIDENCE }}
          if-no-files-found: ignore
          retention-days: 30

  # The controller/provider scaling profile: same four arms, plus eight controllers (or 32 equivalent
  # native routes), a bounded mixed failure burst, ledger cleanup and keep-alive after 413. Correctness
  # fails the job; sizes and latencies are evidence only (no threshold on a hosted runner).
  performance-scaling:
    name: Full-stack performance, controller scaling profile (Node + local workerd)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'performance-scaling'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      STRATA_PERF_REPS: ${{ inputs.reps || '3' }}
      STRATA_PERF_BUILD_REPS: ${{ inputs.build_reps || '3' }}
      STRATA_PERF_REQUESTS: ${{ inputs.requests || '200' }}
      STRATA_PERF_WARMUP: ${{ inputs.warmup || '50' }}
      STRATA_PERF_CONCURRENCY: ${{ inputs.concurrency || '8' }}
      STRATA_PERF_ISLANDS: "3"
      STRATA_PERF_CONTROLLERS: "8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          build: "false"
          playwright: "true"

      - name: Evidence directory
        run: echo "STRATA_PERF_OUT=$RUNNER_TEMP/full-stack-performance-scaling" >> "$GITHUB_ENV"

      - name: Measure three islands and eight controllers
        run: pnpm test:full-stack-performance

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          [ -f "$STRATA_PERF_OUT/summary.md" ] && cat "$STRATA_PERF_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-performance-scaling-evidence
          path: ${{ env.STRATA_PERF_OUT }}
          if-no-files-found: ignore
          retention-days: 30

  registry:
    name: Published package on Cloudflare Pages (build + local workerd rehearsal)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'registry'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          build: "false"
          playwright: "true"

      - name: Published package (no account, no secrets, no deployment)
        run: pnpm test:server-components:deployed-cloudflare

  # The PUBLISHED core, analog and server-components (exact versions of the package manifests, or
  # STRATA_REGISTRY_*_VERSION) installed from npm into the full-stack consumer: Node + local workerd +
  # Chromium. Read-only: no account, no secret, no deployment.
  registry-full-stack:
    name: Published full-stack tuple (Node + local workerd, no deployment)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'registry'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STRATA_KEEP_CONSUMER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Published full-stack consumer
        run: pnpm test:full-stack-registry-consumer

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-registry-diagnostics
          path: |
            ${{ runner.temp }}/strata-diagnostics
            /tmp/strata-full-stack-consumer-*/consumer/dist
          if-no-files-found: ignore
          retention-days: 14

  # `npm ci` of the committed candidate (tests/full-stack-candidate): the exact qualified dependency
  # tree, refused if the registry, the lock, the fixture manifest or the toolchain differ from it.
  registry-frozen-candidate:
    name: Frozen release candidate (npm ci of the captured tree; Node + local workerd)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'registry'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          build: "false"
          playwright: "true"

      - name: Frozen candidate consumer
        run: pnpm test:full-stack-frozen-candidate

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-frozen-candidate-diagnostics
          path: ${{ runner.temp }}/strata-diagnostics
          if-no-files-found: ignore
          retention-days: 14

  registry-upgrade-rollback:
    name: Published A/B upgrade and rollback (Node + local workerd + deployment rehearsal, no deployment)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'registry'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          build: "false"
          playwright: "true"

      # Installs two exact published tuples from npm into two external consumers (override with
      # STRATA_UPGRADE_{A,B}_{CORE,ANALOG,SERVER_COMPONENTS}_VERSION). No account, no secret, no deployment.
      - name: Published A/B upgrade and rollback
        run: pnpm test:full-stack-registry-upgrade-rollback

  types:
    name: Consumer type-closure experiment (SPEC-002)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'types'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Type closure
        run: pnpm test:consumer:types

  integrity:
    name: Production SSR integrity (repeated independent builds, cold starts)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STRATA_INTEGRITY_BUILDS: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `runner.*` is not available in job-level `env`, so the diagnostics directory is set here.
      - name: Diagnostics directory
        run: echo "STRATA_DIAGNOSTICS_DIR=$RUNNER_TEMP/strata-diagnostics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Packed consumer with repeated independent builds
        run: pnpm test:server-component-package-consumer

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-integrity-diagnostics
          path: ${{ runner.temp }}/strata-diagnostics
          if-no-files-found: ignore
          retention-days: 30
