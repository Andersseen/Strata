name: Qualify Server Components on Cloudflare

# Manually triggered, REAL deployment qualification of the PUBLISHED
# @strata-sc/server-components on an isolated Cloudflare Pages project.
#
# - workflow_dispatch only: never on a PR, push or schedule.
# - Installs the exact version from registry.npmjs.org into a fresh app outside
#   the workspace, builds it with Nitro's cloudflare-pages preset, deploys it to
#   the `strata-sc-qualification` Pages project (a runner guard refuses any other
#   project name, `strata-www` included), then runs the HTTP, Playwright,
#   confidentiality and bounded-concurrency checks against the public
#   https://<hash>.strata-sc-qualification.pages.dev URL.
# - No npm publish permission, no website deployment, no DNS/route/binding change.
# - STRATA_SC_REQUIRE_DEPLOYED=1: missing Cloudflare secrets or a failed
#   deployment FAIL the job. A skipped deployment is never reported as success.
#
# Uses the repository's existing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# secrets (the ones deploy-www in ci.yml uses); they are exposed to the one step
# that deploys, and the runner redacts them from anything it prints.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to qualify, e.g. 0.1.0 (empty: packages/server-components/package.json)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: server-component-deployed-cloudflare
  cancel-in-progress: false

jobs:
  deployed:
    name: Deploy and qualify on Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node --experimental-strip-types tools/release/resolve-registry-version.ts "$INPUT_VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Setup Playwright browser
        run: pnpm --filter @strata-sc/www exec playwright install --with-deps chromium

      - name: Deploy to the isolated Pages project and qualify the public URL
        run: pnpm test:server-components:deployed-cloudflare
        env:
          STRATA_SC_REGISTRY_VERSION: ${{ steps.version.outputs.version }}
          STRATA_SC_DEPLOY: "1"
          STRATA_SC_REQUIRE_DEPLOYED: "1"
          STRATA_SC_PAGES_PROJECT: strata-sc-qualification
          STRATA_SC_EVIDENCE_FILE: ${{ runner.temp }}/deployed-cloudflare-evidence.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-cloudflare-evidence
          path: ${{ runner.temp }}/deployed-cloudflare-evidence.json
          if-no-files-found: ignore
