name: Qualify Full-Stack Strata on Cloudflare
# The API exposes no dispatch inputs: the title is how the RC gate tells these runs apart.
run-name: Qualify Full-Stack Strata on Cloudflare (${{ inputs.source || 'packed' }})

# Manually triggered, REAL deployment qualification of the complete Strata full-stack path
# (@strata-sc/core + @strata-sc/analog + @strata-sc/server-components) on an isolated
# Cloudflare Pages project. See docs/research/full-stack-deployed-cloudflare.md.
#
# - workflow_dispatch ONLY: never on a pull request, push, schedule or release.
# - SOURCE-PACKED CANDIDATE: the three packages are `pnpm pack`ed from the dispatched ref and
#   installed as tarballs into tests/full-stack-package-consumer/fixture outside the workspace.
#   This is NOT a published-registry qualification; nothing is published to npm.
# - Deploys only to the `strata-fullstack-qualification` Pages project (an exact allowlist in the
#   runner and below refuses any other name, `strata-www` and `strata-sc-qualification` included),
#   creating it only if it does not exist. No DNS, route, binding or other-project change.
# - STRATA_FULLSTACK_REQUIRE_DEPLOYED=1: missing Cloudflare secrets or a failed deployment FAIL the
#   job. A skipped deployment is never reported as success.
#
# Uses the repository's existing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets (the ones
# deploy-www in ci.yml uses). They are exposed to the one step that runs the qualification; the
# runner removes them from every local build/test command and redacts them from anything printed.
#
# `source` selects the candidate. `packed` (the default, unchanged) is the source-packed candidate above.
# `registry` installs @strata-sc/{core,analog,server-components} from npm at EXACT versions (empty inputs
# default to the dispatched ref's manifest versions) and runs `test:full-stack-registry-deployed-cloudflare`;
# a version that is not on npm exits 3, NOT AVAILABLE (not a runtime failure, not a GO, nothing substituted).
# See docs/research/full-stack-registry-qualification.md.
#
# `upgrade-rollback` runs `test:full-stack-registry-upgrade-rollback` on the cloudflare runtime with
# STRATA_UPGRADE_DEPLOY=1: two exact PUBLISHED tuples (STRATA_UPGRADE_* defaults, the core/analog/
# server_components inputs are ignored) are built and verified locally, the deployment rehearsal must
# pass, then release A, release B and A's RETAINED artifact are deployed in turn to the preview branch
# `m5-upgrade-rollback` of the same isolated project and verified on its branch alias (stale clients get
# the previous deployment's real assets from its immutable URL). See
# docs/research/m5-production-qualification.md.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Candidate: packed (this checkout, default) or registry (published npm versions)"
        required: false
        type: choice
        options: [packed, registry, upgrade-rollback]
        default: packed
      core_version:
        description: "registry only: @strata-sc/core exact version (default: manifest)"
        required: false
        type: string
      analog_version:
        description: "registry only: @strata-sc/analog exact version (default: manifest)"
        required: false
        type: string
      server_components_version:
        description: "registry only: @strata-sc/server-components exact version (default: manifest)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: full-stack-deployed-cloudflare
  cancel-in-progress: false

env:
  PAGES_PROJECT: strata-fullstack-qualification

jobs:
  deployed:
    name: Deploy and qualify the full-stack app on Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright browser
        run: pnpm --filter @strata-sc/www exec playwright install --with-deps chromium

      - name: Deploy to the isolated Pages project and qualify the public URL
        run: |
          test "$PAGES_PROJECT" = "strata-fullstack-qualification"
          if [ "$CANDIDATE_SOURCE" = "registry" ]; then
            pnpm test:full-stack-registry-deployed-cloudflare
          elif [ "$CANDIDATE_SOURCE" = "upgrade-rollback" ]; then
            STRATA_UPGRADE_DEPLOY=1 STRATA_UPGRADE_REQUIRE_DEPLOYED=1 \
              STRATA_UPGRADE_RUNTIMES=cloudflare \
              STRATA_UPGRADE_PAGES_PROJECT="$PAGES_PROJECT" \
              STRATA_UPGRADE_EVIDENCE="$RUNNER_TEMP/full-stack-deployed-evidence.json" \
              pnpm test:full-stack-registry-upgrade-rollback
          else
            pnpm test:full-stack-deployed-cloudflare
          fi
        env:
          CANDIDATE_SOURCE: ${{ inputs.source }}
          STRATA_REGISTRY_CORE_VERSION: ${{ inputs.core_version }}
          STRATA_REGISTRY_ANALOG_VERSION: ${{ inputs.analog_version }}
          STRATA_REGISTRY_SERVER_COMPONENTS_VERSION: ${{ inputs.server_components_version }}
          STRATA_FULLSTACK_DEPLOY: "1"
          STRATA_FULLSTACK_REQUIRE_DEPLOYED: "1"
          STRATA_FULLSTACK_PAGES_PROJECT: ${{ env.PAGES_PROJECT }}
          STRATA_FULLSTACK_EVIDENCE_FILE: ${{ runner.temp }}/full-stack-deployed-evidence.json
          STRATA_FULLSTACK_DIAGNOSTICS_DIR: ${{ runner.temp }}/full-stack-deployed-diagnostics
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-deployed-cloudflare-evidence
          path: ${{ runner.temp }}/full-stack-deployed-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      # Only a failed run has a screenshot and a Playwright trace of the public site.
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-deployed-cloudflare-browser-diagnostics
          path: ${{ runner.temp }}/full-stack-deployed-diagnostics
          if-no-files-found: ignore
          retention-days: 14
