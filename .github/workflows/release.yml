name: Release

# Runs on every push to main (i.e. after a PR is merged):
#
# - If there are pending changesets, it opens/updates a "Version Packages" PR
#   that bumps versions (patch/minor/major, as declared in each changeset) and
#   writes the CHANGELOGs.
# - If there are none (e.g. that version PR was just merged), it publishes every
#   non-private package whose version is not on npm yet, under the `next`
#   dist-tag (never `latest`) with npm provenance, and creates the git tags and
#   GitHub Releases. When @strata-sc/server-components was among the published
#   packages, the registry consumer then verifies that exact version.
#
# Requires the repository secret NPM_TOKEN (npm granular token with publish
# access to @strata-sc/*), and "Allow GitHub Actions to create and approve pull
# requests" enabled in Settings → Actions → General.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version commit, tags, GitHub Releases
  pull-requests: write # Version Packages PR
  id-token: write # npm provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Version PR or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          publish-script: pnpm changeset publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Post-publish gate: only when this run actually published
      # @strata-sc/server-components. Installs that exact version from
      # registry.npmjs.org into a fresh temp app and verifies dist-tags, integrity,
      # build, SSR, hydration and the server-only firewall. A failure fails the
      # workflow visibly; it never unpublishes, moves a dist-tag or republishes.
      # Remediation is a human decision.
      - name: Setup Playwright browser (registry consumer)
        if: steps.changesets.outputs.published == 'true' && contains(fromJSON(steps.changesets.outputs.publishedPackages).*.name, '@strata-sc/server-components')
        run: pnpm --filter @strata-sc/www exec playwright install --with-deps chromium

      - name: Verify @strata-sc/server-components from the npm registry
        if: steps.changesets.outputs.published == 'true' && contains(fromJSON(steps.changesets.outputs.publishedPackages).*.name, '@strata-sc/server-components')
        run: pnpm test:server-component-registry-consumer
        env:
          STRATA_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
