name: Release

# Starts only after CI has completed. The authorization job proves the source was
# this repository's main push, its aggregate Verify succeeded for its SHA, and
# that SHA is still main before any versioning or publishing step can run.
#
# - If there are pending changesets, it opens/updates a "Version Packages" PR
#   that bumps versions (patch/minor/major, as declared in each changeset) and
#   writes the CHANGELOGs.
# - The release state is classified first (tools/release/release-state.ts):
#   VERSION_REQUIRED (nonempty changesets), PUBLISH_REQUIRED, ALREADY_PUBLISHED
#   or BLOCKED (unreadable registry, bad dependency versions; fails the run).
#   Empty changesets never suppress publishing.
# - On PUBLISH_REQUIRED (e.g. that version PR was just merged), it publishes every
#   non-private package whose version is not on npm yet, with npm provenance,
#   and creates the git tags and GitHub Releases. Stable versions go to the
#   `latest` dist-tag; prereleases (Changesets pre mode, `changeset pre enter
#   next`) go to `next` (ADR-005). It then aligns the dist-tags of the current
#   versions (idempotent; repairs anything published off-policy). When
#   @strata-sc/server-components was among the published packages, the registry
#   consumer then verifies that exact version.
#
# Requires the repository secret NPM_TOKEN (npm granular token with publish
# access to @strata-sc/*), and "Allow GitHub Actions to create and approve pull
# requests" enabled in Settings → Actions → General.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  authorize:
    name: Verify exact main CI result
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      # The authorizer itself comes from the default branch. Do not execute a
      # script from the untrusted workflow_run head before it is authorized.
      - name: Checkout trusted default-branch authorizer
        uses: actions/checkout@v7
      - name: Validate source run, exact Verify job and current main head
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --experimental-strip-types tools/release/authorize.ts

  release:
    name: Version or publish
    needs: authorize
    if: needs.authorize.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write # version commit, tags, GitHub Releases
      pull-requests: write # Version Packages PR
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Read-only decision from the Changesets and the npm registry (never from
      # changesets/action's hasChangesets: empty-only Changesets make it report
      # true, skip publishing and still succeed). A BLOCKED state, including
      # an unreadable registry, fails here. PUBLISH_REQUIRED drops the empty
      # Changesets from this ephemeral checkout so the action runs its publish
      # script; nothing is committed.
      - name: Classify release state
        id: state
        run: node --experimental-strip-types tools/release/release-state.ts classify --prepare

      # Close the window in which a queued release can become stale while its
      # dependencies are installing and building. Verify again immediately
      # before the one step that can version or publish.
      - name: Recheck exact main CI result before release action
        if: steps.state.outputs.state == 'VERSION_REQUIRED' || steps.state.outputs.state == 'PUBLISH_REQUIRED'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --experimental-strip-types tools/release/authorize.ts

      - name: Version PR or publish to npm
        id: changesets
        if: steps.state.outputs.state == 'VERSION_REQUIRED' || steps.state.outputs.state == 'PUBLISH_REQUIRED'
        uses: changesets/action@v2
        with:
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          # No --tag: Changesets publishes to `latest`, or to the pre-mode tag for prereleases.
          publish-script: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Realign dist-tags (idempotent; also repairs off-policy history), then
      # require the registry to hold every public package at its manifest
      # version. A skipped or no-op publish cannot pass this.
      - name: Align npm dist-tags
        if: steps.state.outputs.state == 'PUBLISH_REQUIRED' || steps.state.outputs.state == 'ALREADY_PUBLISHED'
        run: pnpm release:sync-dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm registry, tags and GitHub Releases
        if: steps.state.outputs.state == 'PUBLISH_REQUIRED' || steps.state.outputs.state == 'ALREADY_PUBLISHED'
        run: node --experimental-strip-types tools/release/release-state.ts verify --published=${{ steps.state.outputs.unpublished }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Post-publish gate: only when this run had to publish
      # @strata-sc/server-components. Installs that exact version from
      # registry.npmjs.org into a fresh temp app and verifies dist-tags, integrity,
      # build, SSR, hydration and the server-only firewall. A failure fails the
      # workflow visibly; it never unpublishes, moves a dist-tag or republishes.
      # Remediation is a human decision. Kept separate from the registry check above.
      - name: Setup Playwright browser (registry consumer)
        if: steps.state.outputs.state == 'PUBLISH_REQUIRED' && steps.state.outputs.server-components-unpublished == 'true'
        run: pnpm --filter @strata-sc/www exec playwright install --with-deps chromium

      - name: Verify @strata-sc/server-components from the npm registry
        if: steps.state.outputs.state == 'PUBLISH_REQUIRED' && steps.state.outputs.server-components-unpublished == 'true'
        run: pnpm test:server-component-registry-consumer
        env:
          STRATA_SC_REGISTRY_VERSION: ${{ steps.state.outputs.server-components-version }}
