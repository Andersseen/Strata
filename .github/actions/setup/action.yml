name: Setup Strata workspace
description: Install pnpm, Node and the locked dependencies, build the packages, and optionally install Chromium.

inputs:
  build:
    description: >-
      "true" builds the whole workspace (packages and apps; needed by type-aware lint and typecheck).
      "packages" builds only packages/* (every suite that builds its own fixture, app or external
      consumer from fresh sources). "false" builds nothing.
    default: "true"
  playwright:
    description: Install Chromium for the browser suites.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Lint uses typescript-eslint's projectService, which resolves `@strata-sc/*` through their
    # package.json `exports` (pointing at `dist`): build before lint/typecheck (docs/STATE.md).
    - name: Build
      if: inputs.build == 'true'
      shell: bash
      run: pnpm build

    # The Server Component, Analog and packed-consumer suites build the fixture, the apps or the
    # external consumer themselves from the checked-out sources. They only need the package
    # `dist/` that those builds and `pnpm pack` resolve; the workspace app builds (~75% of
    # `pnpm build`) were discarded unread. Nothing is restored from another commit.
    - name: Build packages
      if: inputs.build == 'packages'
      shell: bash
      run: pnpm exec turbo run build --filter='./packages/*'

    # The hosted Ubuntu image already carries Chromium's shared libraries. `--with-deps` additionally
    # apt-installs font packages from the Ubuntu mirror, which stalled at ~24 kB/s for 9-10 minutes in
    # hosted runs 42043494173 and 42046849111 (docs/research/ci-acceleration.md). Install the browser
    # only, prove it launches, and install the system dependencies only when that real launch fails:
    # a missing library still fails the job instead of being skipped.
    - name: Install Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        pnpm --filter @strata-sc/www exec playwright install chromium
        launch='import("playwright").then(({ chromium }) => chromium.launch()).then((browser) => browser.close())'
        if ! node -e "$launch"; then
          echo "::warning::Chromium did not launch without system dependencies; installing them"
          pnpm --filter @strata-sc/www exec playwright install-deps chromium
          node -e "$launch"
        fi
